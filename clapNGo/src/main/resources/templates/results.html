	<style>
	    .center {
		  width: 300px;
		  height: 300px;
		  display: block;
		  margin-left: auto;
		  margin-right: auto;
			}


	@import url(https://fonts.googleapis.com/css?family=Open+Sans);

	body{
	    #backgroundImage {
	        border: none;
	        height: 20%;
	        pointer-events: none;
	        position: fixed;
	        top: 0;
	        visibility: hidden;
	        width: 20%;
	     }
    }

	.center {
      width: 100px;
      height: 100px;
	  display: block;
	  margin-left: 200px;
	  margin-right: 200px;
		}

	body{   
		background-image: linear-gradient(to right , #E0E0E0 , #ef473a);
		font-family: 'Open Sans', sans-serif;
	}

	.search {
	  width: 100%;
	  position: relative;
	  display: flex;
	}

	.searchTerm {
	  width: 100%;
	  border: 3px solid #000000;
	  border-right: none;
	  padding: 5px;
	  height: 20px;
	  border-radius: 5px 0 0 5px;
	  outline: none;
	  color: #606060;
	}

	.searchTerm:focus{
	  color: black;
	}

	.searchButton {
	  width: 40px;
	  height: 36px;
	  border: 1px solid black;
	  background: black;
	  text-align: center;
	  color: #fff;
	  border-radius: 0 5px 5px 0;
	  cursor: pointer;
	  font-size: 20px;
	}

	/*Resize the wrap to see the search bar change!*/
	.wrap{
	  width: 30%;
	  position: absolute;
	  top: 5%;
	  left: 50%;
	  transform: translate(-50%, -50%);
	}

	input {
		accent-color: black;
	}
	
	a {
	  text-decoration: none;
	  display: inline-block;
	  padding: 8px 16px;
	}

	a:hover {
	  background-image:  linear-gradient(to right , #cb2d3e , #ef473a);
	  color: black;
	}

	.previous {
	  background-color: #EE3636;
	  color: black;
	}

	.next {
	  background-color: #EE3636;
	  color: white;
	}

	.round {
	  border-radius: 50%;
	}
	
	.myButton {
    position: absolute;
    left:15%;
	color: red;
    background-color:red;
}

#example1 {
  padding: 25px;
  background-color: linear-gradient(to right , #cb2d3e , #ef473a);
  background-repeat: no-repeat;
  background-size: auto;
}

.sortButton {
	box-shadow:inset 0px 0px 14px -3px #f2fadc;
	background:linear-gradient(to bottom, #dbe6c4 5%, #9ba892 100%);
	background-color:#dbe6c4;
	border-radius:6px;
	border:1px solid #b2b8ad;
	display:inline-block;
	cursor:pointer;
	color:#757d6f;
	font-family:Arial;
	font-size:15px;
	font-weight:bold;
	padding:6px 24px;
	text-decoration:none;
	text-shadow:0px 1px 0px #ced9bf;
}
.sortButton:hover {
	background:linear-gradient(to bottom , #cb2d3e , #ef473a);
	background-color:#9ba892;
}
.sortButton:active {
	position:relative;
	top:1px;
}

div.absolute {
  position: absolute;
  top: 80px;
  right: 0;

  width: 200px;
  height: 100px;

  <form th:action = "@{/results}" th:object="${searcher}">
	  <div align="center">
		<input type="radio" id="None" name="default" th:field="*{search_options}" value="None" checked required="required">
		<label>None</label>
		<input type="radio" id="Title" name="default" value="Title" th:field="*{search_options}" checked required="required">
		<label>Title</label>
		<input type="radio" id="Genres" name="default" value="Genres" th:field="*{search_options}" checked required="required">
		<label>Genres</label>
		<input type="radio" id="Keywords" name="default" value="Keywords" th:field="*{search_options}" checked required="required">
		<label>Keywords</label>
		<input type="radio" id="Overview" name="default" value="Overview" th:field="*{search_options}" checked required="required">
		<label>Overview</label>
		<input type="radio" id="Released date" name="default" value="Released date" th:field="*{search_options}" checked required="required">
		<label>Released date</label>
	  </div>
	  <div class="wrap">
	   <div class="search">
		
		  <input type="text" id="searcher" class="searchTerm" th:field="*{search_movie}" th:value="*{search_movie}" placeholder="Search movie" required="required">
		  <button type="submit" class="searchButton">
			<i class="fa fa-search"></i>
		 </button>
	   
		</div>
	   </div>
   </form>

	<form th:action = "@{/results}" th:object="${searcher}">	
		<select th:field="*{search_order}">
			<option th:id="${order[0][1]}" th:value="${order[0][1]}" th:text="${order[0][0]}"></option>
			<option th:id="${order[1][1]}" th:value="${order[1][1]}" th:text="${order[1][0]}"></option>
			<option th:id="${order[2][1]}" th:value="${order[2][1]}" th:text="${order[2][0]}"></option>
			<option th:id="${order[3][1]}" th:value="${order[3][1]}" th:text="${order[3][0]}"></option>
		</select>
	<button type="submit" class="sortButton">Sort</button>
	</br></br></br>
	</form>
