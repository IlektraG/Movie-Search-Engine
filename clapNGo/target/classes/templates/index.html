    <style>
    
    body{

	        border: none;
	        height: 50%;
	        pointer-events: none;
	        position: fixed;
	        top: 38%;
	        visibility: hidden;
	        width: 50%;

@import url(https://fonts.googleapis.com/css?family=Open+Sans);

body{
  background-image: linear-gradient(to right , #cb2d3e , #ef473a);
  font-family: 'Open Sans', sans-serif;
}

.search {
  width: 100%;
  position: relative;
  display: flex;
}

.searchTerm {
  width: 100%;
  border: 3px solid #000000;
  border-right: none;
  padding: 5px;
  height: 20px;
  border-radius: 5px 0 0 5px;
  outline: none;
  color: #606060;
}

.searchTerm:focus{
  color: black;
}

.searchButton {
  width: 40px;
  height: 36px;
  border: 1px solid black;
  background: black;
  text-align: center;
  color: #fff;
  border-radius: 0 5px 5px 0;
  cursor: pointer;
  font-size: 20px;
}

/*Resize the wrap to see the search bar change!*/
.wrap{
  width: 30%;
  position: absolute;
  top: 70%;
  left: 50%;
  transform: translate(-50%, -50%);
}


	.radiowrap {
	  width: 40%;
	  position: absolute;
	  top: 64%;
	  left: 50%;
	  transform: translate(-50%, -50%);
		}
		
input {
	accent-color: black;
}


	/* CSS */
	.button-62 {
	  background: linear-gradient(to bottom right, #EF4765, #FF9A5A);
	  border: 0;
	  border-radius: 12px;
	  color: #FFFFFF;
	  cursor: pointer;
	  display: inline-block;
	  font-family: -apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
	  font-size: 16px;
	  font-weight: 500;
	  line-height: 2.5;
	  outline: transparent;
	  padding: 0 1rem;
	  text-align: center;
	  text-decoration: none;
	  transition: box-shadow .2s ease-in-out;
	  user-select: none;
	  -webkit-user-select: none;
	  touch-action: manipulation;
	  white-space: nowrap;
	}
	
	.button-62:not([disabled]):focus {
	  box-shadow: 0 0 .25rem rgba(0, 0, 0, 0.5), -.125rem -.125rem 1rem rgba(239, 71, 101, 0.5), .125rem .125rem 1rem rgba(255, 154, 90, 0.5);
	}
	
	.button-62:not([disabled]):hover {
	  box-shadow: 0 0 .25rem rgba(0, 0, 0, 0.5), -.125rem -.125rem 1rem rgba(255, 255, 255, 0.5), .125rem .125rem 1rem rgba(255, 255, 255, 0.5);
	}

	.buttonCenter {
	  left:46%;
	  margin: 0;
	  position: absolute;
	  top: 80%;
	  -ms-transform: translateY(-50%);
	  transform: translateY(-50%);
	}


	.title {
	  width: 40%;
	  position: absolute;
	  top: 32%;
	  left: 80%;
	  transform: translate(-50%, -50%);
		}
		
		h1 {
  transform: skew(#{$rotationAmt}deg) rotate(#{$rotationAmt}deg);
  grid-area: text;
  font-family: 'Sarpanch', sans-serif;
  font-size: 10vmin;
  margin: 0;
  padding: 20px;
  color: #1d9099;
  text-shadow: 1vmin 1vmin 0 #E79C10, -1vmin -1vmin 0 #9410CD;
}
    </style>

  </head>
  <body>
  <div>

  		</br>
  		
  </div>
<div th:object="${searcher}">
  <form th:action = "@{/results}" >
  <div align="center" class="radiowrap">
	<input type="radio" id="None" name="default" th:field="*{search_options}" value="None" checked required="required">
	<label>None</label>
	<input type="radio" id="Title" name="default" value="Title" th:field="*{search_options}" checked required="required">
	<label>Title</label>
	<input type="radio" id="Genres" name="default" value="Genres" th:field="*{search_options}" checked required="required">
	<label>Genres</label>
	<input type="radio" id="Keywords" name="default" value="Keywords" th:field="*{search_options}" checked required="required">
	<label>Keywords</label>
	<input type="radio" id="Overview" name="default" value="Overview" th:field="*{search_options}" checked required="required">
	<label>Overview</label>
	<input type="radio" id="Released date" name="default" value="Released date" th:field="*{search_options}" checked required="required">
	<label>Released date</label>
 </div>
 <div class="wrap">
   <div class="search">
   	
      <input type="text" class="searchTerm" th:field="*{search_movie}" th:value="*{search_movie}" placeholder="Search movie" required="required">
      <button type="submit" class="searchButton">
        <i class="fa fa-search"></i>
     </button>
   
   </div>
</div>


	<div class="title">
	<h1>Clap N</h1>
	<h1>Go!</h1>
	</div>

	<div class="buttonCenter">
		<a th:href = "@{/feelingLucky}" class="button-62" type="button">I'm feeling lucky!</a>
	</div>
  
  </body>
</html>
